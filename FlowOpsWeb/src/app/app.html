<main class="p-8 font-sans">
<h1 class="text-2xl font-bold mb-6">Lista incydentów FlowOps</h1>
  <div class="space-y-4">
    @for (incident of incidents(); track incident.id) {
      <div class="p-4 border rounded shadow-sm bg-white">
        <h2 class="text-xl font-semibold text-blue-600">{{ incident.title }}</h2>
        <p class="text-gray-700 mt-2">{{ incident.description }}</p>

        <div class="mt-4 text-sm text-gray-500 flex gap-4">
          <span>Priorytet: {{ incident.priority }}</span>
          <span>Utworzono: {{ incident.createdAt | date:'short' }}</span>
        </div>
      </div>
    } @empty {
      <div class="p-4 bg-gray-50 text-gray-500 rounded border">
        Brak aktywnych incydentów w systemie.
      </div>
    }
  </div>
</main>
